name: Cypress E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress:
    name: Preparar ambiente de testes
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v7

      - name: Configurar o Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

            - name: Executar testes E2E
        uses: cypress-io/github-action@v7
        with:
          install: false  